version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: savings_tracker_dev
      POSTGRES_USER: savings_tracker
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savings_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
