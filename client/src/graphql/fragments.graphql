fragment UserFields on User {
  id
  email
}

fragment PersonFields on Person {
  id
  name
  createdAt
}

fragment CategoryFields on TransactionCategory {
  id
  name
  createdAt
}

fragment TotalsFields on AccountTotals {
  totalCredits
  totalDebits
  net
}

fragment AccountFields on Account {
  id
  name
  description
  createdAt
  people {
    ...PersonFields
  }
}

fragment TransactionFields on Transaction {
  id
  amount
  description
  occurredOn
  createdAt
  person {
    ...PersonFields
  }
  category {
    ...CategoryFields
  }
}

fragment ScenarioFields on Scenario {
  id
  name
  startDate
  endDate
  createdAt
}

fragment ScenarioEventFields on ScenarioEvent {
  id
  amount
  description
  startDate
  endDate
  recurrenceInterval
  recurrenceUnit
  createdAt
  person {
    ...PersonFields
  }
  category {
    ...CategoryFields
  }
}

fragment GridDataFields on GridData {
  rows {
    person {
      ...PersonFields
    }
    cells {
      categoryId
      amount
    }
    total
  }
  columnTotals
  grandTotal
}

fragment ScenarioGridFields on ScenarioGrid {
  people {
    ...PersonFields
  }
  categories {
    ...CategoryFields
  }
  baseline {
    ...GridDataFields
  }
  projected {
    ...GridDataFields
  }
}
