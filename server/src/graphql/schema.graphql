type User {
  id: ID!
  email: String!
  createdAt: String!
}

type AuthPayload {
  user: User!
}

type Person {
  id: ID!
  name: String!
  createdAt: String!
}

type TransactionCategory {
  id: ID!
  name: String!
  createdAt: String!
}

type Account {
  id: ID!
  name: String!
  description: String
  people: [Person!]!
  transactions(filter: TransactionFilter, limit: Int, offset: Int): [Transaction!]!
  totals(filter: TransactionFilter): AccountTotals!
  createdAt: String!
}

type AccountTotals {
  totalCredits: Float!
  totalDebits: Float!
  net: Float!
}

type Transaction {
  id: ID!
  account: Account!
  person: Person!
  category: TransactionCategory!
  amount: Float!
  description: String
  occurredOn: String!
  createdAt: String!
}

input TransactionFilter {
  personIds: [ID!]
  categoryIds: [ID!]
}

input SignupInput {
  email: String!
  password: String!
}

input SignInInput {
  email: String!
  password: String!
}

input CreateAccountInput {
  name: String!
  description: String
  personIds: [ID!]
}

input UpdateAccountInput {
  name: String
  description: String
  personIds: [ID!]
}

input CreatePersonInput {
  name: String!
}

input UpdatePersonInput {
  name: String
}

input CreateCategoryInput {
  name: String!
}

input UpdateCategoryInput {
  name: String
}

input CreateTransactionInput {
  accountId: ID!
  personId: ID!
  categoryId: ID!
  amount: Float!
  description: String
  occurredOn: String
}

input UpdateTransactionInput {
  personId: ID
  categoryId: ID
  amount: Float
  description: String
  occurredOn: String
}

"""
How often a scenario event repeats. Mirrored by a CHECK constraint on
scenario_events.recurrence_unit and the union type in src/lib/recurrence.ts.
"""
enum RecurrenceUnit {
  DAY
  WEEK
  MONTH
  YEAR
}

"""
A planned contribution or withdrawal inside a scenario. Recurring when both
recurrenceInterval and recurrenceUnit are set, one-time when both are null —
the database rejects any half-specified pairing.
"""
type ScenarioEvent {
  id: ID!
  person: Person!
  category: TransactionCategory!
  amount: Float!
  description: String
  startDate: String!
  "When this event stops repeating. Null means it runs to the scenario's end."
  endDate: String
  recurrenceInterval: Int
  recurrenceUnit: RecurrenceUnit
  createdAt: String!
}

type Scenario {
  id: ID!
  name: String!
  account: Account!
  startDate: String!
  endDate: String!
  events: [ScenarioEvent!]!
  "Computed on request; the filter narrows both grids identically."
  grid(filter: TransactionFilter): ScenarioGrid!
  createdAt: String!
}

"""
Two person × category grids over one shared pair of axes: the account on the
scenario's start date, and the projection if every event occurs. Shared axes are
what make the two tables comparable row by row.
"""
type ScenarioGrid {
  "Row headings, shared by both grids."
  people: [Person!]!
  "Column headings, shared by both grids."
  categories: [TransactionCategory!]!
  baseline: GridData!
  projected: GridData!
}

type GridData {
  rows: [GridRow!]!
  "Aligned to the shared categories axis."
  columnTotals: [Float!]!
  grandTotal: Float!
}

type GridRow {
  person: Person!
  cells: [GridCell!]!
  total: Float!
}

"""
Carries its categoryId rather than relying on position alone, so a client and
server disagreeing about column order cannot silently file figures under the
wrong heading.
"""
type GridCell {
  categoryId: ID!
  amount: Float!
}

input CreateScenarioInput {
  accountId: ID!
  name: String!
  startDate: String!
  endDate: String!
}

input UpdateScenarioInput {
  name: String
  startDate: String
  endDate: String
}

input CreateScenarioEventInput {
  scenarioId: ID!
  personId: ID!
  categoryId: ID!
  amount: Float!
  description: String
  startDate: String!
  endDate: String
  recurrenceInterval: Int
  recurrenceUnit: RecurrenceUnit
}

"""
Omitting a field leaves it unchanged; passing null clears it. That distinction
matters for endDate and the recurrence pair, since clearing both recurrence
fields is how a repeating event becomes a one-time one.
"""
input UpdateScenarioEventInput {
  personId: ID
  categoryId: ID
  amount: Float
  description: String
  startDate: String
  endDate: String
  recurrenceInterval: Int
  recurrenceUnit: RecurrenceUnit
}

type Query {
  me: User
  accounts: [Account!]!
  account(id: ID!): Account
  people: [Person!]!
  users: [User!]!
  user(id: ID!): User
  transactionCategories: [TransactionCategory!]!
  scenario(id: ID!): Scenario
  scenarios(accountId: ID!): [Scenario!]!
}

type Mutation {
  signup(input: SignupInput!): AuthPayload!
  signIn(input: SignInInput!): AuthPayload!
  signOut: Boolean!

  createAccount(input: CreateAccountInput!): Account!
  updateAccount(id: ID!, input: UpdateAccountInput!): Account!
  deleteAccount(id: ID!): Boolean!

  createPerson(input: CreatePersonInput!): Person!
  updatePerson(id: ID!, input: UpdatePersonInput!): Person!
  deletePerson(id: ID!): Boolean!

  createTransactionCategory(input: CreateCategoryInput!): TransactionCategory!
  updateTransactionCategory(id: ID!, input: UpdateCategoryInput!): TransactionCategory!
  deleteTransactionCategory(id: ID!): Boolean!

  createTransaction(input: CreateTransactionInput!): Transaction!
  updateTransaction(id: ID!, input: UpdateTransactionInput!): Transaction!
  deleteTransaction(id: ID!): Boolean!

  createScenario(input: CreateScenarioInput!): Scenario!
  updateScenario(id: ID!, input: UpdateScenarioInput!): Scenario!
  deleteScenario(id: ID!): Boolean!

  createScenarioEvent(input: CreateScenarioEventInput!): ScenarioEvent!
  updateScenarioEvent(id: ID!, input: UpdateScenarioEventInput!): ScenarioEvent!
  deleteScenarioEvent(id: ID!): Boolean!
}
