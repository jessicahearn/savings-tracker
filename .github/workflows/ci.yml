name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest

    services:
      # The server suite is made of real integration tests against Postgres, so
      # CI needs a database. This one is thrown away with the job; the password
      # is not a secret and is unreachable from outside the runner.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: savings_tracker
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: savings_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The name must end in _test; support/testDb.ts refuses to run otherwise.
      TEST_DATABASE_URL: postgres://savings_tracker:ci_only_password@localhost:5432/savings_tracker_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The local `migrate:test` script hardcodes --envPath ../.env, which does
      # not exist here, so point node-pg-migrate at the env var directly.
      - name: Migrate the test database
        working-directory: server
        run: npx node-pg-migrate -d TEST_DATABASE_URL up

      - name: Typecheck server
        run: npx tsc -p server/tsconfig.json --noEmit

      - name: Typecheck client
        run: npx tsc -p client/tsconfig.json --noEmit

      - name: Test
        run: npm run test -ws --if-present

  publish:
    name: Build and publish image
    # Gated on verify, so a failing test suite can never produce a deployable
    # image. Pull requests stop after verify and publish nothing.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Supplied by Actions; there is no secret to create or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # The mini-PC is x86_64.
          platforms: linux/amd64
          push: true
          # The :latest tag is what deploy.ps1 pulls. The commit-sha tag is the
          # rollback path — pin the api image to one of these to go back.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
